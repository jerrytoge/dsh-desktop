name: Build macOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Narrowest permissions. `release` job re-declares what it needs; `build`
# only needs read (default). No top-level write grant leaks to other jobs.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron@43+ no longer downloads its binary via postinstall; it is
      # fetched lazily on first `electron .` or on demand via install.js.
      # electron-builder reads node_modules/electron/dist, so fetch it explicitly.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # B2: fetch the bundled Node runtime (darwin-arm64) instead of
      # committing a 138MB binary to git. Mirrors the local `npm run fetch-node`.
      - name: Fetch bundled Node runtime
        run: npm run fetch-node

      # PR: build the unpacked .app only (fast verification, no zip/dmg).
      # main / tag / manual: full build (dir + zip + dmg) for release.
      - name: "Build app (PR: dir only)"
        if: github.event_name == 'pull_request'
        run: npm run build:dir

      - name: "Build app (full: dir + zip + dmg)"
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: Verify no dsh packages were pruned
        run: |
          SRC_DIR="node_modules/@deepseek-ai"
          APP_DIR="dist/mac-arm64/DeepSeek Harness.app/Contents/Resources/app/node_modules/@deepseek-ai"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: packaged node_modules not found at: $APP_DIR"
            exit 1
          fi
          MISSING=$(comm -23 <(ls "$SRC_DIR" | sort) <(ls "$APP_DIR" | sort))
          echo "source @deepseek-ai packages: $(ls "$SRC_DIR" | wc -l | tr -d ' ')"
          echo "packaged @deepseek-ai packages: $(ls "$APP_DIR" | wc -l | tr -d ' ')"
          if [ -n "$MISSING" ]; then
            echo ""
            echo "ERROR: these @deepseek-ai packages were pruned from the packaged app:"
            echo "$MISSING"
            echo ""
            echo "They are peer dependencies that electron-builder's production pruning"
            echo "removed. Add them as direct dependencies in package.json, then re-run."
            exit 1
          fi
          echo "OK: all @deepseek-ai packages present in the packaged app"

      - name: Upload artifact (full build only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: dsh-desktop-macos
          path: |
            dist/*.app/**/*
            dist/*.zip
            dist/*.dmg
          if-no-files-found: warn

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest   # releasing needs no macOS — saves runner minutes
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dsh-desktop-macos
          path: dist

      - name: Generate timestamp tag
        id: tag
        run: echo "tag=v$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.dmg
