name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron@43+ no longer downloads its binary via postinstall; it is
      # fetched lazily on first `electron .` or on demand via install.js.
      # electron-builder reads node_modules/electron/dist, so fetch it explicitly.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # B2: fetch the bundled Node runtime (darwin-arm64) instead of
      # committing a 138MB binary to git. Mirrors the local `npm run fetch-node`.
      - name: Fetch bundled Node runtime
        run: npm run fetch-node

      - name: Build app (dir + zip)
        # --publish never: electron-builder auto-detects CI and would try to
        # publish to GitHub Releases, requiring a GH_TOKEN. We publish ourselves
        # via upload-artifact + action-gh-release below.
        run: npm run build -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos
          path: |
            dist/*.app/**/*
            dist/*.zip
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-macos

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$(date +%Y%m%d-%H%M%S)
          files: dist/*.zip
