# electron-builder configuration for the dsh-desktop prototype.
#
# Design notes:
# - asar: false — the sidecar Node process must require() the bundled
#   node_modules as real files; Node cannot read inside an asar archive.
# - extraResources — the bundled Node runtime, placed at Resources/node so the
#   packaged app has a node binary even though the host has none on PATH.
# - mac.identity: "-" — ad-hoc signed build (no Developer ID certificate).

appId: com.deepseek.harness.desktop
productName: DeepSeek Harness
copyright: Copyright © 2025

# Disable electron-builder's implicit publish. In CI it auto-detects the
# environment and tries to publish to GitHub Releases (needing GH_TOKEN);
# we publish ourselves via the workflow's upload-artifact + action-gh-release.
publish: null

directories:
  output: dist
  buildResources: build

# Reuse the Electron dist already extracted by `npm install` (node_modules/electron/dist)
# instead of re-downloading the zip through @electron/get. This also sidesteps
# @electron/get's default cache under ~/Library/Caches/electron.
electronDist: node_modules/electron/dist

asar: false

# Keep only the Electron/Chromium locales used by the product. The web UI ships
# its own translations, so this only affects Chromium-owned menus/error pages.
electronLanguages:
  - en
  - zh_CN

# Prefer release size over build speed for the distributable DMG/zip.
compression: maximum

# Remove optional native binaries for platforms other than the only supported
# target. The hook asserts all required darwin-arm64 binaries exist and verifies
# that the complete @deepseek-ai package set remains unchanged.
afterPack: scripts/after-pack.cjs

# The harness runs under the BUNDLED Node (not Electron), so its native modules
# (sharp, node-pty, …) must stay on the Node ABI. Disable electron-builder's
# automatic @electron/rebuild step.
npmRebuild: false

files:
  - main.js
  - preload.js
  - desktop.cordis.patch.yml
  - lib/**/*
  - package.json
  - packages/dsh-client-ui-settings-desktop/package.json
  - packages/dsh-client-ui-settings-desktop/lib/**/*
  - packages/dsh-agent-communication-policy/package.json
  - packages/dsh-agent-communication-policy/lib/**/*

extraResources:
  - from: node
    to: node
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  # Ad-hoc signature ("-") gives the app a locally-valid signature without an
  # Apple Developer certificate. This avoids Gatekeeper's "app is damaged"
  # rejection for unsigned builds. (Remove the line entirely for a true
  # Developer ID + notarized release later.)
  identity: "-"
  target:
    - dir
    - dmg
  # Entitlements for the ad-hoc signed app. disable-library-validation is
  # REQUIRED: the sidecar Node loads unsigned native modules (node-pty, koffi,
  # sharp, …) which hardened runtime would otherwise reject at launch.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Release signing (requires a Developer ID Application certificate and an
  # Apple ID for notarization) would add:
  #   hardenedRuntime: true
  #   gatekeeperAssess: false
  #   notarize: true
